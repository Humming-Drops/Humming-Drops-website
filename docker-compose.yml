services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hummingdrops_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local MongoDB, standing in for MongoDB Atlas for local testing only.
  # No existing feature reads/writes it yet (see src/lib/mongodb.ts).
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db

  # The app itself, containerized the same way it deploys on Railway
  # (multi-stage Dockerfile, standalone Next.js output). For local
  # testing only -- points DATABASE_URL/MONGODB_URI at the compose
  # service names instead of localhost, since "localhost" inside this
  # container means the container itself, not the host.
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_CHECKOUT_MODE: ${NEXT_PUBLIC_CHECKOUT_MODE:-assisted_lead}
        NEXT_PUBLIC_OFFICIAL_PHONE: ${NEXT_PUBLIC_OFFICIAL_PHONE:-8618902810}
        NEXT_PUBLIC_OFFICIAL_EMAIL: ${NEXT_PUBLIC_OFFICIAL_EMAIL:-hummingdrops@gmail.com}
        NEXT_PUBLIC_OFFICIAL_LOCATION: ${NEXT_PUBLIC_OFFICIAL_LOCATION:-Berrybeats cafe, Bangalore}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_placeholder_key}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hummingdrops_dev
      MONGODB_URI: mongodb://mongo:27017/hummingdrops_dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started

volumes:
  postgres_dev_data:
  mongo_dev_data:
